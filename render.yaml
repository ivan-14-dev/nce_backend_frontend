services:
  # Frontend (Vite preview)
  - type: web
    name: nce-frontend
    plan: free
    region: oregon
    runtime: node
    buildCommand: "cd site-nceOutsourcing && npm install --no-fund --no-audit && npm run build"
    startCommand: "cd site-nceOutsourcing && node ./node_modules/vite/bin/vite.js preview --host 0.0.0.0 --port $PORT"

  # Backend (Django + Gunicorn)
  - type: web
    name: nce-backend-web
    plan: free
    region: oregon
    runtime: python
    buildCommand: "pip install -r django_backend/requirements.txt --no-input"
    startCommand: "./django_backend/render-start-web.sh"

  # Worker (Celery + Beat)
  - type: worker
    name: nce-backend-worker
    plan: free
    region: oregon
    runtime: python
    buildCommand: "pip install -r django_backend/requirements.txt --no-input"
    startCommand: "./django_backend/render-start-celery.sh"
