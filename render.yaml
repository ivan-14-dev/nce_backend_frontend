services:
  # Backend (Django + Gunicorn)
  - type: web
    name: nce-backend-web
    plan: free
    region: oregon
    runtime: python
    buildCommand: "pip install -r django_backend/requirements.txt --no-input"
    startCommand: "cd django_backend && PYTHONPATH=. gunicorn nce_backend_tmp.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"

  # Worker (Celery + Beat)
  - type: worker
    name: nce-backend-worker
    plan: free
    region: oregon
    runtime: python
    buildCommand: "pip install -r django_backend/requirements.txt --no-input"
    startCommand: "cd django_backend && PYTHONPATH=. ./render-start-celery.sh"
